name: Build and Push Docker Image

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag"
        required: true
        default: "dev"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      #
      # Stable release tags
      #
      - name: Extract metadata (release)
        if: startsWith(github.ref, 'refs/tags/v')
        id: meta_release
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/einker
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      #
      # Manual/dev tags
      #
      - name: Extract metadata (manual)
        if: github.event_name == 'workflow_dispatch'
        id: meta_manual
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/einker
          tags: |
            type=raw,value=${{ github.event.inputs.image_tag }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta_release.outputs.tags }}
            ${{ steps.meta_manual.outputs.tags }}
          labels: |
            ${{ steps.meta_release.outputs.labels }}
            ${{ steps.meta_manual.outputs.labels }}
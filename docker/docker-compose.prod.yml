services:
  web:
    image: ghcr.io/phistoh/einker:latest
    pull_policy: always
    command: gunicorn -w 1 -b 0.0.0.0:8000 einker.web:app
    restart: unless-stopped
    ports:
      - "8269:8000"
    volumes:
      - ./data:/app/data:Z
      - ./incoming:/app/incoming:Z
    environment:
      - APP_BASE_DIR=/app
      - HOME=/tmp
      - TZ=Europe/Berlin
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  watcher:
    image: ghcr.io/phistoh/einker:latest
    command: python -m einker.watcher
    restart: unless-stopped
    volumes:
      - ./data:/app/data:Z
      - ./incoming:/app/incoming:Z
    environment:
      - APP_BASE_DIR=/app
      - HOME=/tmp
      - TZ=Europe/Berlin
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from einker.bootstrap import ready_check; ready_check()"
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Image</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            background: url("{{ url_for('static', filename='assets/paper.jpg') }}") repeat;

            font-family: sans-serif;
        }

        .framed {
            height: 480px;
            padding: 48px;
            box-shadow:
                0 22px 40px rgba(0, 0, 0, 0.65),
                inset 0 0 0 2px rgba(255, 255, 255, 0.08);

            background: url("{{ url_for('static', filename='assets/frame.png') }}") center / 100% 100% no-repeat;
        }

        .background-tint {
            background-color: rgba(40, 61, 89, 0.5);
            background-blend-mode: multiply;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .image-id {
            margin-top: 12px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }
    </style>
</head>

<body class="background-tint">
    <div class="content">
        <div class="framed">
            <img src="{{ img_src }}" />
        </div>

        <div class="image-id">
            {{ image_id }}
        </div>
    </div>
</body>

</html>
